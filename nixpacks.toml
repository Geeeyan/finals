[variables]
PHP_VERSION = "8.4"

[phases.setup]
nixPkgs = ["php84", "php84Extensions.pdo", "php84Extensions.pdo_sqlite", "php84Extensions.sqlite3", "php84Packages.composer"]

[phases.build]
cmds = ["composer install --no-dev --optimize-autoloader", "php artisan config:cache", "php artisan route:cache", "php artisan storage:link"]

[phases.deploy]
cmds = ["php artisan migrate --force"]

[start]
cmd = "php -S 0.0.0.0:${PORT:-8080} -t public"
